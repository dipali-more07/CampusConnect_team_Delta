name: CampusConnect Deployment Script

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/github_actions_cc
          chmod 600 ~/.ssh/github_actions_cc
          ssh-keyscan -H ${{ secrets.JUMP_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Application
        run: |
          ssh -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=3 \
              -i ~/.ssh/github_actions_cc \
              ${{ secrets.JUMP_USER }}@${{ secrets.JUMP_HOST }} \
              "bash ~/deploy-jump.sh"
